<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>PriceLog</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css?v=0.15">
</head>
<body>
  <header class="topbar">
    <div>
      <strong>PriceLog</strong>
      <small>Ver.0.15</small>
    </div>
    <div class="top-actions">
      <button id="btnSettings" class="icon-btn" type="button" aria-label="設定">⚙</button>
      <button id="btnBulkStore" class="ghost mini" type="button">一括店舗</button>
      <button id="btnAddProduct" class="primary mini" type="button">＋商品</button>
    </div>
  </header>

  <main>
    <div class="best-legend">
      <span><strong>★</strong> 通常最安</span>
      <span><strong>◆</strong> クーポン適用後最安</span>
    </div>

    <section class="searchbar">
      <input id="searchInput" type="search" placeholder="商品を検索" autocomplete="off">
      <span id="productCount" class="count"></span>
    </section>

    <section id="bulkStoreBar" class="bulk-store-bar hidden">
      <div class="bulk-store-top">
        <strong>選択した商品に店舗を一括追加</strong>
        <span id="bulkSelectedCount">0件選択</span>
      </div>
      <div class="bulk-store-controls">
        <input id="bulkStoreName" type="text" maxlength="40" placeholder="店舗名">
        <button id="btnBulkSelectAll" class="ghost mini" type="button">全選択</button>
        <button id="btnBulkAdd" class="primary mini" type="button">追加</button>
        <button id="btnBulkCancel" class="ghost mini" type="button">終了</button>
      </div>
      <div id="bulkMessage" class="bulk-message"></div>
    </section>

    <section id="productList" class="product-list"></section>
    <div id="emptyState" class="empty hidden">商品がまだないよ。「＋商品」から追加してね。</div>
  </main>

  <dialog id="productDialog" class="dialog">
    <form id="productForm" method="dialog">
      <div class="dialog-head">
        <strong id="productDialogTitle">商品追加</strong>
        <button class="icon-btn" value="cancel" type="submit" aria-label="閉じる">×</button>
      </div>

      <label>商品名
        <input id="productName" required maxlength="60" placeholder="例：ブレンディ">
      </label>

      <label class="reading-field">よみがな
        <input id="productReading" maxlength="80" placeholder="例：ぎゅうにゅう">
      </label>

      <div class="grid3">
        <label>内容量
          <input id="productAmount" required type="text" inputmode="decimal" value="100">
        </label>
        <label>単位
          <select id="productUnit">
            <option value="g">g</option>
            <option value="ml">ml</option>
            <option value="個">個</option>
            <option value="枚">枚</option>
            <option value="本">本</option>
            <option value="袋">袋</option>
            <option value="箱">箱</option>
          </select>
        </label>
        <label>既定税率
          <select id="productTax"></select>
        </label>
      </div>

      <div class="dialog-actions">
        <button id="btnDeleteProduct" class="danger ghost hidden" type="button">商品削除</button>
        <button class="primary" value="default" type="submit">保存</button>
      </div>
    </form>
  </dialog>

  <dialog id="settingsDialog" class="dialog">
    <form id="settingsForm" method="dialog">
      <div class="dialog-head">
        <strong>設定</strong>
        <button class="icon-btn" value="cancel" type="submit" aria-label="閉じる">×</button>
      </div>

      <div class="settings-block">
        <div class="settings-title">消費税</div>
        <div class="grid2">
          <label>標準税率
            <div class="suffix">
              <input id="standardTax" type="text" inputmode="decimal">
              <span>%</span>
            </div>
          </label>
          <label>軽減税率
            <div class="suffix">
              <input id="reducedTax" type="text" inputmode="decimal">
              <span>%</span>
            </div>
          </label>
        </div>
      </div>

      <div class="settings-block">
        <div class="settings-title">価格入力</div>
        <label>初期状態
          <select id="defaultPriceType">
            <option value="inc">税込</option>
            <option value="ex">税抜</option>
          </select>
        </label>
      </div>

      <div class="settings-block">
        <div class="settings-title">商品テンプレート</div>
        <div class="template-note">既存データは残して、未登録の商品だけ追加する。</div>
        <button id="btnLoadTemplate" class="ghost backup-btn" type="button">商品テンプレートを読み込む</button>
        <div id="templateMessage" class="template-message"></div>
      </div>

      <div class="settings-block">
        <div class="settings-title">データ</div>
        <div class="stack">
          <button id="btnExport" class="ghost backup-btn" type="button">バックアップを書き出す</button>
          <button id="btnImport" class="ghost backup-btn" type="button">バックアップを読み込む</button>
          <input id="importFile" class="hidden-file-input" type="file" accept="application/json,.json">
        </div>
      </div>

      <div class="dialog-actions">
        <button class="primary" value="default" type="submit">設定を保存</button>
      </div>
    </form>
  </dialog>


  <dialog id="historyDialog" class="dialog history-dialog">
    <div class="history-panel">
      <div class="dialog-head">
        <div>
          <strong>変更履歴</strong>
          <div id="historyProductName" class="history-product-name"></div>
        </div>
        <button id="btnCloseHistory" class="icon-btn" type="button" aria-label="閉じる">×</button>
      </div>

      <div class="history-note">価格変更の直近20件</div>

      <div id="historyTableWrap" class="history-table-wrap">
        <div class="history-grid history-head">
          <span>更新日</span>
          <span>店舗名</span>
          <span>変更前価格</span>
          <span>変更後価格</span>
        </div>
        <div id="historyList"></div>
      </div>

      <div id="historyEmpty" class="history-empty hidden">価格変更履歴はまだないよ。</div>
    </div>
  </dialog>

  <template id="productTemplate">
    <article class="product-card">
      <div class="product-summary-row">
        <label class="bulk-check-wrap hidden">
          <input class="bulk-check" type="checkbox" aria-label="一括店舗追加の対象に選択">
        </label>
        <button class="product-summary" type="button">
          <span class="summary-main">
            <span class="product-name"></span>
            <span class="product-size"></span>
          </span>
          <span class="best-wrap">
            <span class="best-store"></span>
            <span class="best-values">
              <span class="best-metric">
                <span class="metric-mark">★◆</span>
                <span class="best-price"></span>
              </span>
              <span class="best-metric">
                <span class="metric-mark">★◆</span>
                <strong class="best-unit"></strong>
              </span>
            </span>
          </span>
          <span class="chev">›</span>
        </button>
      </div>

      <div class="product-detail hidden">
        <div class="detail-toolbar">
          <button class="btn-edit-product ghost mini" type="button">商品設定</button>
          <button class="btn-history ghost mini" type="button">変更履歴</button>
          <button class="btn-add-store primary mini" type="button">＋店舗</button>
        </div>

        <div class="store-scroll">
          <div class="store-table">
            <div class="store-head">
              <span class="mark-head"></span><span>店舗</span><span>入力価格</span><span>税込</span><span>税率</span><span>クーポン</span><span>値</span><span>価格(クーポン適用)</span><span>単価(クーポン適用)</span><span></span>
            </div>
            <div class="store-list"></div>
          </div>
        </div>
      </div>
    </article>
  </template>

  <template id="storeTemplate">
    <div class="store-row">
      <span class="best-mark" aria-hidden="true"></span>
      <input class="st-store" type="text" maxlength="40" placeholder="店舗">
      <input class="st-price" type="text" inputmode="decimal" placeholder="価格">
      <select class="st-price-type" aria-label="税込・税抜">
        <option value="inc">込</option>
        <option value="ex">抜</option>
      </select>
      <select class="st-tax" aria-label="税率"></select>
      <select class="st-coupon-type" aria-label="クーポン">
        <option value="none">なし</option>
        <option value="percent">%OFF</option>
        <option value="yen">円引</option>
      </select>
      <input class="st-coupon-value" type="text" inputmode="decimal" placeholder="-">
      <output class="st-price-result">-</output>
      <output class="st-unit">-</output>
      <button class="st-delete" type="button" aria-label="店舗行を削除">×</button>
    </div>
  </template>

  <script src="./app.js?v=0.15"></script>
</body>
</html>
